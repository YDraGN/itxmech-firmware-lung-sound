; RespiCare lung-sound recorder (ESP32 38-pin + INMP441).
; Build configuration comes from exported environment variables (see .env.example);
; scripts/build_config.py turns them into include/BuildConfig.h and picks the
; sources for the selected environment.

[platformio]
default_envs = production

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 921600
monitor_filters = esp32_exception_decoder, time
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
  -Isrc
  -DCORE_DEBUG_LEVEL=1
extra_scripts = pre:scripts/build_config.py
lib_deps =
  256dpi/MQTT@2.5.2
  bblanchon/ArduinoJson@7.4.2

; Full device: MQTT command -> record WAV -> HTTPS upload -> complete.
[env:production]

; Bench test: stream filtered PCM over USB serial (tools/serial_record.py).
[env:stream_serial]

; Bench test: stream filtered PCM over UDP with sequence numbers
; (tools/udp_record.py repairs lost packets by repetition).
[env:stream_udp]
